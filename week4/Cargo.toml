[package]
name = "advection"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "wave-check"
path = "scripts/wave_check.rs"

[[bin]]
name = "dump-stability"
path = "scripts/dump_stability.rs"

[[bin]]
name = "pulse-field"
path = "scripts/pulse_field.rs"

[[bin]]
name = "accuracy-run"
path = "scripts/accuracy_run.rs"

[[bin]]
name = "convergence"
path = "scripts/convergence.rs"

[[bin]]
name = "method-convergence"
path = "scripts/method_convergence.rs"

[[bin]]
name = "field"
path = "scripts/field.rs"

[[bin]]
name = "fluid"
path = "scripts/fluid.rs"

[[bin]]
name = "differentiate"
path = "scripts/differentiate.rs"

[[bin]]
name = "perturb"
path = "scripts/perturb.rs"
